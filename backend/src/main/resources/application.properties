# Load project-root .env (Spring Boot standard — no custom loader)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Google AI API Configuration
google.ai.api.key=${GOOGLE_AI_API_KEY:}
google.ai.api.model=${GOOGLE_AI_MODEL:gemini-3.1-flash-lite}

# Gemini rate limits — free tier quotas are per model.
# Each SDLC run uses many API calls (requirements + architecture + tool loops).
gemini.rate-limit-ms=${GEMINI_RATE_LIMIT_MS:13000}
gemini.retry-max=${GEMINI_RETRY_MAX:3}
gemini.retry-backoff-ms=${GEMINI_RETRY_BACKOFF_MS:10000}

# LLM provider: ollama | qwen | gemini | openrouter
llm.provider=${LLM_PROVIDER:qwen}

# Ollama — install from https://ollama.com
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}

# Qwen via Ollama (strong tool calling on Mac M3)
qwen.model=${QWEN_MODEL:qwen2.5:7b-instruct}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:300}

# OpenRouter — OpenAI-compatible API (https://openrouter.ai)
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
openrouter.timeout-seconds=${OPENROUTER_TIMEOUT_SECONDS:300}

# Neo4j graph + vector index (persists in Docker volume — no rebuild on restart)
neo4j.enabled=${NEO4J_ENABLED:true}
neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
neo4j.username=${NEO4J_USERNAME:neo4j}
neo4j.password=${NEO4J_PASSWORD:password}
neo4j.vector-dimensions=${NEO4J_VECTOR_DIMENSIONS:1024}

# Server Configuration
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.aidevassistant=INFO
logging.level.org.springframework.web=INFO

# Sandbox Configuration
sandbox.root.path=data/sandbox
personas.root.path=data/personas
requirements.root.path=data/requirements

# Agent loop — max LangChain4j tool calls per SDLC stage (implementation uses the full budget)
agent.max-steps=${AGENT_MAX_STEPS:50}
agent.max-review-rounds=1
# 0 = mock SDLC (default), 1 = real LangGraph + LLM
agent.sdlc.use-api=${SDLC_USE_API:0}
agent.sdlc.recursion-limit=50
agent.sdlc.mock-phase-ms=1200
agent.approval.hitl=true
execution.timeout-seconds=15
